<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便签窗口 - UI 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0d0d11;
    color: #e8e8e8;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    gap: 40px;
    flex-wrap: wrap;
  }

  :root {
    --bg-primary: rgba(20, 20, 25, 0.92);
    --bg-secondary: rgba(26, 26, 32, 0.95);
    --bg-card: rgba(30, 30, 38, 0.8);
    --bg-hover: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.06);
    --border-divider: rgba(255, 255, 255, 0.08);
    --text-primary: #e8e8e8;
    --text-secondary: #a0a0a0;
    --text-muted: #666666;
    --brand: #4c9eeb;
    --brand-dim: rgba(76, 158, 235, 0.15);
    --error: #f44336;
    --radius: 4px;
  }

  .label {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  /* ============ 便签窗口容器 ============ */
  .note-window {
    width: 360px;
    height: 420px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    position: relative;
  }
  .note-window.compact {
    width: 240px;
    height: 200px;
  }

  /* ============ 标题栏 ============ */
  .note-header {
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    background: rgba(15, 15, 20, 0.4);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    cursor: move;
    user-select: none;
  }
  .note-header-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .note-header-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .note-header-time {
    font-size: 10px;
    color: var(--text-muted);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .note-header-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .note-header-btn {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.15s, color 0.15s;
  }
  .note-header-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .note-header-btn svg { width: 14px; height: 14px; }
  .note-header-btn.pinned { color: var(--brand); }

  /* ============ 内容区 ============ */
  .note-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 10px 12px 8px;
  }

  /* 标题输入 */
  .title-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    padding: 4px 0;
    margin-bottom: 8px;
    border-bottom: 1px dashed var(--border-divider);
    font-family: inherit;
  }
  .title-input::placeholder { color: var(--text-muted); }

  /* 内容文本区 */
  .content-area {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-primary);
    font-family: inherit;
    overflow-y: auto;
  }
  .content-area::-webkit-scrollbar { width: 3px; }
  .content-area::-webkit-scrollbar-track { background: transparent; }
  .content-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .content-area::placeholder { color: var(--text-muted); }

  /* ============ 待办清单 ============ */
  .todo-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 4px;
    border-radius: var(--radius);
    transition: background 0.15s;
  }
  .todo-item:hover { background: var(--bg-hover); }
  .todo-checkbox {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--text-muted);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .todo-checkbox.checked {
    background: var(--brand);
    border-color: var(--brand);
  }
  .todo-checkbox svg { width: 10px; height: 10px; color: white; display: none; }
  .todo-checkbox.checked svg { display: block; }
  .todo-text {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    color: var(--text-primary);
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
  }
  .todo-item.done .todo-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .todo-delete {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .todo-item:hover .todo-delete { opacity: 1; }
  .todo-delete:hover { color: var(--error); }
  .todo-delete svg { width: 12px; height: 12px; }

  .todo-add {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-top: 1px dashed var(--border-divider);
    margin-top: 4px;
  }
  .todo-add svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
  .todo-add input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 12px;
    color: var(--text-secondary);
    font-family: inherit;
  }
  .todo-add input::placeholder { color: var(--text-muted); }

  /* ============ 底部状态栏 ============ */
  .note-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    height: 24px;
  }
  .note-footer-left {
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .save-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brand);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .note-footer-right {
    font-size: 10px;
    color: var(--text-muted);
  }

  /* ============ 缩放手柄 ============ */
  .resize-handle {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 16px;
    height: 16px;
    cursor: nwse-resize;
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 8px;
    height: 8px;
    border-right: 2px solid rgba(255,255,255,0.15);
    border-bottom: 2px solid rgba(255,255,255,0.15);
    border-bottom-right-radius: 2px;
  }

  /* ============ 紧凑模式 ============ */
  .compact-summary {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .compact-todos {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }
  .compact-todo {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .compact-todo .ct-check {
    width: 12px;
    height: 12px;
    border: 1.5px solid var(--text-muted);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .compact-todo .ct-check.done {
    background: var(--brand);
    border-color: var(--brand);
  }
  .compact-todo.done { color: var(--text-muted); }
  .compact-todo.done .ct-text { text-decoration: line-through; }
  .compact-todo .ct-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .compact-more {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ============ 右键菜单 ============ */
  .context-menu {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 0;
    min-width: 150px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 100;
    display: none;
  }
  .context-menu.show { display: block; }
  .cm-item {
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cm-item:hover { background: var(--bg-hover); }
  .cm-item.danger { color: var(--error); }
  .cm-item.danger:hover { background: rgba(244,67,54,0.1); }
  .cm-divider {
    height: 1px;
    background: var(--border-divider);
    margin: 4px 0;
  }
  .cm-label {
    padding: 4px 14px 2px;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cm-colors {
    display: flex;
    gap: 6px;
    padding: 6px 14px;
  }
  .cm-color {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
  }
  .cm-color:hover { border-color: var(--text-primary); transform: scale(1.15); }
  .cm-color.active { border-color: var(--brand); }

  /* ============ 切换按钮 ============ */
  .preview-controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 200;
  }
  .preview-btn {
    background: rgba(30,30,38,0.95);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }
  .preview-btn:hover { border-color: var(--brand); color: var(--brand); }
  .preview-btn.active { background: var(--brand); color: white; border-color: var(--brand); }
</style>
</head>
